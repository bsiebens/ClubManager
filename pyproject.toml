[project]
name = "clubmanager"
version = "0.1.0"
description = "Software to manage (sport)clubs, built out of frustration with the available commercial tools."
authors = [
    {name = "Bernard Siebens",email = "bernard@siebens.org"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.6,<6.0.0)",
    "django-htmx (>=1.23.2,<2.0.0)",
    "python-decouple (>=3.8,<4.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.build.dependencies]
poetry-core = ">=2.0.0"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
django-debug-toolbar = "^6.0.0"

[tool.poetry]
package-mode = false