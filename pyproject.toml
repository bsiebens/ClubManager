[project]
name = "clubmanager"
version = "0.1.0"
description = "Software to manage (sport)clubs, built out of frustration with the available commercial tools."
authors = [
    { name = "Bernard Siebens", email = "bernard@siebens.org" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.6,<6.0.0)",
    "django-htmx (>=1.23.2,<2.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "django-constance (>=4.3.2,<5.0.0)",
    "django-ninja (>=1.4.3,<2.0.0)",
    "rules (>=3.5,<4.0)",
    "django-simple-history (>=3.10.1,<4.0.0)",
    "django-phonenumber-field[phonenumbers] (>=8.1.0,<9.0.0)",
    "django-allauth[headless-spec] (>=65.11.1,<66.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "markdown (>=3.9,<4.0)",
    "django-filter (>=25.1,<26.0)",
    "django-template-partials (>=25.1,<26.0)",
    "channels[daphne] (>=4.3.1,<5.0.0)",
    "django-generic-notifications (>=1.3.0,<2.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "django-polymorphic (>=4.1.0,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.build.dependencies]
poetry-core = ">=2.0.0"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
django-debug-toolbar = "^6.0.0"
coverage = ">=7.10.6,<8.0.0"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 250